<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A rose garden</title>
  <meta name="description" content="Roses that never wilt.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>">
  <script>
    /* prima del paint, cosi non c'e' flash di tema sbagliato */
    (function () {
      var s = new URLSearchParams(location.search).get("style") || "garden";
      if (["garden", "code", "blueprint", "paper"].indexOf(s) < 0) s = "garden";
      document.documentElement.setAttribute("data-style", s);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0B0B0F;
      --cream: #FDF6F0;
      --accent: #F5C99B;
      --veil: 11, 11, 15;
      --edge: 0, 0, 0;
      --edge-a: .62;
      --term: #8FD5A8;
      --halo: radial-gradient(closest-side, rgba(245, 201, 155, .20), rgba(226, 140, 160, .07) 46%, transparent 74%);
      --serif: "Cormorant Garamond", Iowan Old Style, Palatino, "Palatino Linotype", Georgia, "Times New Roman", serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

      --t-focus: 8.7s;
      --t-msg: 9.3s;

      --ease: cubic-bezier(.22, 1, .36, 1);
      --back: cubic-bezier(.34, 1.56, .64, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--ink);
      color: var(--cream);
      overflow: hidden;
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      position: fixed;
      inset: 0;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
      cursor: pointer
    }

    #halo {
      position: absolute;
      left: 50%;
      top: 58%;
      width: min(150vw, 1200px);
      aspect-ratio: 1/.9;
      transform: translate(-50%, -50%);
      background: var(--halo);
      opacity: 0;
      animation: fade 3.4s var(--ease) 2s forwards;
      will-change: opacity, transform;
      pointer-events: none;
    }

    @keyframes fade {
      to {
        opacity: 1
      }
    }

    #vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(closest-side at 50% 58%, transparent 48%, rgba(var(--edge), var(--edge-a)) 100%);
    }

    #grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0
    }

    #scene {
      position: absolute;
      inset: 0;
      transform: scale(1.07);
      animation: pullback 12s cubic-bezier(.4, 0, .2, 1) 1.9s forwards;
      will-change: transform;
    }

    @keyframes pullback {
      to {
        transform: scale(1)
      }
    }

    #field {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block
    }

    .stem {
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: grow 1.5s var(--ease) forwards;
      animation-delay: var(--s);
    }

    @keyframes grow {
      to {
        stroke-dashoffset: 0
      }
    }

    .leaf {
      fill: url(#gLeaf);
      transform-box: fill-box;
      transform-origin: 0% 50%;
      transform: scale(.02, .35);
      opacity: 0;
      animation: leafOpen .6s var(--back) forwards;
      animation-delay: calc(var(--s) + .55s + var(--k) * .14s);
    }

    @keyframes leafOpen {
      from {
        transform: scale(.02, .35);
        opacity: 0
      }

      to {
        transform: scale(1, 1);
        opacity: 1
      }
    }

    .blade {
      fill: url(#gLeaf);
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scaleY(.05);
      opacity: 0;
      animation: bladeUp .9s var(--ease) forwards;
      animation-delay: var(--s);
    }

    @keyframes bladeUp {
      from {
        transform: scaleY(.05);
        opacity: 0
      }

      to {
        transform: scaleY(1);
        opacity: 1
      }
    }

    /* il petalo non "scala": parte arrotolato e stretto, poi si apre e si raddrizza */
    .petal {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scale(.07, .2) rotate(-26deg);
      opacity: 0;
      animation: petalOpen .95s var(--ease) forwards;
      animation-delay: calc(var(--b) + var(--j) * .042s);
    }

    @keyframes petalOpen {
      0% {
        transform: scale(.07, .2) rotate(-26deg);
        opacity: 0
      }

      40% {
        opacity: 1
      }

      72% {
        transform: scale(1.06, 1.03) rotate(2.5deg);
        opacity: 1
      }

      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1
      }
    }

    /* spirale arrotolata nel cuore della rosa */
    .swirl {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scale(.1) rotate(-46deg);
      opacity: 0;
      animation: swirlIn .75s var(--back) forwards;
      animation-delay: calc(var(--b) + .34s + var(--j) * .05s);
    }

    @keyframes swirlIn {
      to {
        transform: scale(1) rotate(0deg);
        opacity: 1
      }
    }

    .sepal {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scaleY(.06);
      opacity: 0;
      animation: sepalUp .7s var(--ease) forwards;
      animation-delay: calc(var(--b) - .18s);
    }

    @keyframes sepalUp {
      to {
        transform: scaleY(1);
        opacity: .95
      }
    }

    .thorn {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scale(0);
      opacity: 0;
      animation: coreIn .45s var(--back) forwards;
      animation-delay: calc(var(--s) + .75s);
    }

    /* girasole: disco e semi */
    .disc {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      transform: scale(.06);
      opacity: 0;
      animation: coreIn .65s var(--back) forwards;
      animation-delay: calc(var(--b) + .26s);
    }

    .seed {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      transform: scale(0);
      opacity: 0;
      animation: coreIn .45s var(--back) forwards;
      animation-delay: calc(var(--b) + .52s + var(--j) * .011s);
    }

    .bud {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transform: scale(0);
      opacity: 0;
      animation: coreIn .6s var(--back) forwards;
      animation-delay: calc(var(--b) + .1s);
    }

    .core {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      transform: scale(0);
      opacity: 0;
      animation: coreIn .5s var(--back) forwards;
      animation-delay: calc(var(--b) + .34s);
    }

    @keyframes coreIn {
      to {
        transform: scale(1);
        opacity: 1
      }
    }

    .sway {
      transform-box: view-box;
      transform-origin: var(--ox) 830px;
      animation: sway var(--sd) ease-in-out infinite;
      animation-delay: var(--sdl);
      will-change: transform;
    }

    @keyframes sway {
      0% {
        transform: rotate(0deg)
      }

      25% {
        transform: rotate(-1.1deg)
      }

      75% {
        transform: rotate(1.1deg)
      }

      100% {
        transform: rotate(0deg)
      }
    }

    .bloom {
      transform-box: fill-box;
      transform-origin: 50% 100%
    }

    /* respiro: il fiore non sta mai perfettamente fermo */
    .breathe {
      animation: breathe var(--bd) ease-in-out infinite;
      animation-delay: var(--bdl);
    }

    @keyframes breathe {

      0%,
      100% {
        transform: scale(1) rotate(0deg)
      }

      50% {
        transform: scale(1.03) rotate(1.4deg)
      }
    }

    /* eliotropismo: la testa del girasole insegue la luce, lenta e fuori fase */
    .helio {
      transform-box: fill-box;
      transform-origin: 50% 92%;
      animation: helio var(--hd) ease-in-out infinite;
      animation-delay: var(--hdl);
    }

    @keyframes helio {

      0%,
      100% {
        transform: rotate(-3.6deg)
      }

      50% {
        transform: rotate(3.6deg)
      }
    }

    .bloom.pop {
      animation: pop .75s var(--back)
    }

    @keyframes pop {
      0% {
        transform: scale(1)
      }

      35% {
        transform: scale(1.16)
      }

      100% {
        transform: scale(1)
      }
    }

    .spark {
      fill: var(--accent);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: spark 8s ease-in-out infinite;
    }

    @keyframes spark {
      0% {
        opacity: 0;
        transform: translateY(8px) scale(.6)
      }

      22% {
        opacity: .8
      }

      60% {
        opacity: .5
      }

      100% {
        opacity: 0;
        transform: translateY(-42px) scale(1.05)
      }
    }

    #fall {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden
    }

    .fp {
      position: absolute;
      border-radius: 60% 8% 60% 8%;
      will-change: transform, opacity;
      pointer-events: none
    }

    #focus {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(58% 42% at 50% 47%,
          rgba(var(--veil), .94) 0%, rgba(var(--veil), .86) 42%,
          rgba(var(--veil), .5) 72%, transparent 100%);
      animation: fade 2.2s var(--ease) var(--t-focus) forwards;
    }

    @supports (backdrop-filter: blur(3px)) or (-webkit-backdrop-filter: blur(3px)) {
      #focus {
        -webkit-backdrop-filter: blur(3.5px);
        backdrop-filter: blur(3.5px);
        -webkit-mask-image: radial-gradient(58% 42% at 50% 47%, #000 0%, #000 46%, transparent 78%);
        mask-image: radial-gradient(58% 42% at 50% 47%, #000 0%, #000 46%, transparent 78%);
      }
    }

    #msg {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      padding: 0 9vw;
      text-align: center;
      pointer-events: none;
    }

    .rise {
      opacity: 0;
      transform: translateY(20px);
      animation: rise 1.5s var(--ease) forwards;
      animation-delay: var(--d)
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    #eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .34em;
      text-transform: uppercase;
      color: rgba(245, 201, 155, .62);
      margin-bottom: 1.6em;
    }

    #to {
      display: block;
      font-size: clamp(42px, 14vw, 84px);
      font-weight: 300;
      line-height: 1;
      color: var(--cream);
      text-wrap: balance;
    }

    #ded {
      margin-top: .85em;
      font-size: clamp(16px, 4.9vw, 25px);
      font-weight: 300;
      font-style: italic;
      line-height: 1.62;
      color: var(--cream);
      opacity: .84;
      text-wrap: balance;
    }

    #ded .ln {
      display: block
    }

    #from {
      display: block;
      margin-top: 2em;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: rgba(245, 201, 155, .5);
    }

    #from:empty {
      display: none
    }

    #term {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6em;
      font-family: var(--mono);
      font-size: clamp(12px, 3.6vw, 16px);
      background: var(--ink);
      z-index: 5;
      animation: termOut .5s ease-out 1.82s forwards;
      pointer-events: none;
    }

    @keyframes termOut {
      to {
        opacity: 0;
        visibility: hidden
      }
    }

    #l1 {
      color: var(--term);
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      border-right: .5em solid var(--term)
    }

    @keyframes caret {
      50% {
        border-color: transparent
      }
    }

    #l2 {
      color: var(--cream);
      opacity: 0;
      animation: rise .5s ease-out 1.4s forwards
    }

    /* ======================= STILE: code ======================= */
    [data-style="code"] {
      --ink: #04080B;
      --cream: #C9FADC;
      --accent: #3DDE84;
      --veil: 4, 8, 11;
      --edge: 0, 20, 12;
      --edge-a: .7;
      --term: #3DDE84;
      --halo: radial-gradient(closest-side, rgba(61, 222, 132, .16), rgba(61, 222, 132, .05) 48%, transparent 74%);
    }

    [data-style="code"] #grid {
      opacity: .5;
      background-image:
        repeating-linear-gradient(to bottom, rgba(61, 222, 132, .055) 0 1px, transparent 1px 3px),
        linear-gradient(to right, rgba(61, 222, 132, .07) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(61, 222, 132, .07) 1px, transparent 1px);
      background-size: 100% 3px, 46px 46px, 46px 46px;
    }

    [data-style="code"] #back {
      color: #1B7A47
    }

    [data-style="code"] #mid {
      color: #2CB86C
    }

    [data-style="code"] #front {
      color: #5CF0A2
    }

    [data-style="code"] #turf {
      color: #166B3E
    }

    [data-style="code"] .petal {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.1;
      opacity: .9
    }

    [data-style="code"] .leaf,
    [data-style="code"] .blade {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      opacity: .75
    }

    [data-style="code"] .stem {
      stroke: currentColor !important;
      opacity: .55
    }

    [data-style="code"] .core {
      stroke: currentColor;
      opacity: .9
    }

    [data-style="code"] .spark {
      fill: #5CF0A2
    }

    [data-style="code"] #to,
    [data-style="code"] #ded {
      font-family: var(--mono);
      font-style: normal;
      letter-spacing: -.02em
    }

    [data-style="code"] #to {
      font-size: clamp(30px, 9.5vw, 58px);
      font-weight: 400
    }

    [data-style="code"] #ded {
      font-size: clamp(13px, 3.9vw, 19px);
      line-height: 1.9
    }

    [data-style="code"] #ded .ln::before {
      content: "// ";
      opacity: .45
    }

    [data-style="code"] #eyebrow,
    [data-style="code"] #from {
      color: rgba(61, 222, 132, .6)
    }

    /* ======================= STILE: blueprint ======================= */
    [data-style="blueprint"] {
      --ink: #081524;
      --cream: #DCEEFF;
      --accent: #7FD4FF;
      --veil: 8, 21, 36;
      --edge: 2, 8, 18;
      --edge-a: .72;
      --term: #7FD4FF;
      --halo: radial-gradient(closest-side, rgba(127, 212, 255, .16), rgba(255, 143, 176, .05) 48%, transparent 74%);
    }

    [data-style="blueprint"] #grid {
      opacity: .55;
      background-image:
        linear-gradient(to right, rgba(127, 212, 255, .08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(127, 212, 255, .08) 1px, transparent 1px),
        linear-gradient(to right, rgba(127, 212, 255, .16) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(127, 212, 255, .16) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px, 120px 120px, 120px 120px;
    }

    [data-style="blueprint"] #back {
      color: #2E6B93
    }

    [data-style="blueprint"] #mid {
      color: #54A8D6
    }

    [data-style="blueprint"] #front {
      color: #9EE0FF
    }

    [data-style="blueprint"] #turf {
      color: #2A6182
    }

    [data-style="blueprint"] .petal {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.15;
      opacity: .92
    }

    [data-style="blueprint"] .leaf,
    [data-style="blueprint"] .blade {
      fill: none;
      stroke: currentColor;
      stroke-width: 1;
      opacity: .7
    }

    [data-style="blueprint"] .stem {
      stroke: currentColor !important;
      opacity: .6;
      stroke-dasharray: 100
    }

    [data-style="blueprint"] .core {
      stroke: #FF8FB0;
      opacity: 1;
      stroke-width: 2
    }

    [data-style="blueprint"] .spark {
      fill: #FF8FB0
    }

    [data-style="blueprint"] #eyebrow,
    [data-style="blueprint"] #from {
      color: rgba(255, 143, 176, .75)
    }

    /* ======================= STILE: paper ======================= */
    [data-style="paper"] {
      --ink: #F7F1E8;
      --cream: #2E2621;
      --accent: #B4653F;
      --veil: 247, 241, 232;
      --edge: 150, 124, 96;
      --edge-a: .34;
      --term: #4C7A57;
      --halo: radial-gradient(closest-side, rgba(255, 238, 214, .9), rgba(255, 224, 214, .45) 46%, transparent 74%);
    }

    [data-style="paper"] body {
      background: var(--ink)
    }

    [data-style="paper"] #grid {
      opacity: .5;
      background-image: radial-gradient(rgba(120, 96, 74, .11) 1px, transparent 1px);
      background-size: 4px 4px;
    }

    [data-style="paper"] .stem {
      opacity: .85
    }

    [data-style="paper"] #back {
      opacity: .42 !important
    }

    [data-style="paper"] #eyebrow {
      color: rgba(180, 101, 63, .85)
    }

    [data-style="paper"] #from {
      color: rgba(180, 101, 63, .7)
    }

    [data-style="paper"] #ded {
      opacity: .78
    }

    [data-style="paper"] #l2 {
      color: #6B5B4B
    }

    /* ======================= pannello dedica romantica ======================= */
    #edit {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--cream);
      background: rgba(var(--veil), .78);
      border: 1px solid rgba(245, 201, 155, .35);
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      opacity: 0;
      animation: fade .9s var(--ease) 2.6s forwards;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      display: inline-flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .35);
      transition: transform .25s var(--ease), background .25s, border-color .25s, box-shadow .25s;
    }

    #edit:hover {
      transform: translateY(-2px);
      background: rgba(var(--veil), .92);
      border-color: var(--accent);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .5);
      color: var(--accent);
    }

    #edit .edit-icon {
      font-size: 13px;
      line-height: 1;
    }

    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(18, 18, 24, 0.95);
      color: var(--cream);
      border: 1px solid rgba(245, 201, 155, 0.45);
      padding: 11px 22px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 11.5px;
      letter-spacing: .04em;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.6);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity .32s var(--ease), transform .32s var(--back);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      text-align: center;
      max-width: 90vw;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #panel {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 25;
      max-height: 88vh;
      overflow-y: auto;
      background: rgba(var(--veil), .96);
      border-top: 1px solid rgba(128, 128, 128, .28);
      box-shadow: 0 -10px 40px rgba(0, 0, 0, .5);
      transform: translateY(102%);
      transition: transform .42s var(--ease);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      font-family: var(--mono);
      color: var(--cream);
    }

    #panel.on {
      transform: none;
    }

    #panel > div {
      max-width: 520px;
      margin: 0 auto;
      padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    }

    .panel-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(128, 128, 128, .18);
    }

    .panel-header h2 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-subtitle {
      font-size: 11px;
      opacity: .68;
      line-height: 1.4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: normal;
    }

    .p-close-btn {
      background: rgba(128, 128, 128, .15);
      border: 1px solid rgba(128, 128, 128, .3);
      color: var(--cream);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;

      color: #052610 !important;

  <script>
    (function () {

        if (detail > 1)
          for (i = 0; i < 5; i++) {
            var sw = el("g", { transform: "rotate(" + (i * 72 + 36 + jit(9)).toFixed(1) + ")" });
            sw.appendChild(el("path", {
              d: "M0,0 C-3.4,-9 -2.2,-22 0,-33 C2.2,-22 3.4,-9 0,0 Z",
              fill: WIRE ? "none" : "url(#gLeaf)",
              stroke: WIRE ? "currentColor" : "none",
              "stroke-width": 1,
              "class": "sepal"
            }));
            g.appendChild(sw);
          }

        n = detail > 1 ? 8 : 7;
        for (i = 0; i < n; i++, j++)
          g.appendChild(petal(petalD(19 + jit(1.6), 34 + jit(2.8), 1.06), i * (360 / n) + jit(7), 3, fill, j, .98));

        if (detail > 0) {
          n = detail > 1 ? 7 : 6;
          for (i = 0; i < n; i++, j++)
            g.appendChild(petal(petalD(15 + jit(1.2), 25 + jit(2), .92), 26 + i * (360 / n) + jit(7), 2, fill, j));
        }

        if (detail > 1) {
          n = 6;
          for (i = 0; i < n; i++, j++)
            g.appendChild(petal(petalD(11 + jit(.9), 17 + jit(1.4), .78), 14 + i * (360 / n) + jit(8), 1, fill, j, .96));
        }

        /* ombra nella gola: senza questa il fiore resta piatto */
        if (!WIRE)
          g.appendChild(el("ellipse", {
            cx: 0, cy: -4, rx: 9.5, ry: 8, fill: "rgba(46,12,24,.36)", "class": "core"
          }));

        swirl(g, detail > 1 ? 7 : (detail > 0 ? 5 : 3), fill, j);
      }

      /* girasole: due corone sfalsate + disco coi semi in spirale aurea */
      function sunflower(g, detail) {
        var i, j = 0, n = detail > 1 ? 15 : (detail > 0 ? 13 : 11);

        for (i = 0; i < n; i++, j++)
          g.appendChild(petal(sunPetalD(6.4 + jit(.6), 33 + jit(3)),
            i * (360 / n) + (180 / n) + jit(4), 13, "url(#gSunDeep)", j, .95));

        for (i = 0; i < n; i++, j++)
          g.appendChild(petal(sunPetalD(7.2 + jit(.7), 30 + jit(3)),
            i * (360 / n) + jit(4), 12, "url(#gSun)", j));

        g.appendChild(el("circle", {
          cx: 0, cy: 0, r: 15.5,
          fill: WIRE ? "none" : "url(#gDisc)",
          stroke: WIRE ? "currentColor" : "rgba(38,20,7,.55)",
          "stroke-width": WIRE ? 1.2 : .8,
          "class": "disc"
        }));

        /* angolo aureo: 137.5 gradi in radianti. e' come li mette la pianta */
        var ns = detail > 1 ? 38 : (detail > 0 ? 24 : 0);
        for (i = 0; i < ns; i++) {
          var a = i * 2.39996, r = 2.05 * Math.sqrt(i + .7);
          if (r > 13.4) break;
          var sd = el("circle", {
            cx: (Math.cos(a) * r).toFixed(2),
            cy: (Math.sin(a) * r).toFixed(2),
            r: (1.2 - r * .022).toFixed(2),
            fill: WIRE ? "currentColor" : (i % 3 ? "#3A2410" : "#5E3F1D"),
            "class": "seed"
          });
          sd.style.setProperty("--j", i);
          g.appendChild(sd);
        }

        if (!WIRE)
          g.appendChild(el("circle", {
            cx: 0, cy: 0, r: 15.5, fill: "none",
            stroke: "rgba(28,15,5,.42)", "stroke-width": 2.6, "class": "disc"
          }));
      }

      /* bocciolo chiuso: riempie gli spazi senza costare 18 petali */
      function bud(g, fill) {
        g.appendChild(el("path", {
          d: "M0,0 C-9,-4 -11,-16 -6,-24 C-3,-29 3,-29 6,-24 C11,-16 9,-4 0,0 Z",
          fill: WIRE ? "none" : fill,
          stroke: WIRE ? "currentColor" : "none",
          "stroke-width": 1.1,
          "class": "bud"
        }));
        g.appendChild(el("path", {
          d: "M-6,-3 C-2,-9 2,-9 6,-3",
          fill: "none", stroke: WIRE ? "currentColor" : "rgba(60,18,30,.35)",
          "stroke-width": 1.2, "stroke-linecap": "round", "class": "bud"
        }));
      }

      /* ---------- i tre piani di profondita ---------- */
      var LAYERS = [
        {
          id: "back", n: Math.round(24 * K), y0: 30, y1: 340, s0: .28, s1: .44, det: 0, buds: .40, suns: .10,
          fills: ["url(#gWine)", "url(#gWine)", "url(#gDeep)"], stem: "url(#gStemDark)",
          base: 1.95, span: 1.5, leaves: 1, op: .58, sway: [9, 13]
        },
        {
          id: "mid", n: Math.round(19 * K), y0: 215, y1: 530, s0: .50, s1: .74, det: 1, buds: .20, suns: .16,
          fills: ["url(#gDeep)", "url(#gBlush)", "url(#gWine)", "url(#gPeach)"], stem: "url(#gStem)",
          base: 3.15, span: 1.5, leaves: 2, op: .92, sway: [6.5, 9]
        },
        {
          id: "front", n: Math.round(14 * K), y0: 420, y1: 800, s0: .88, s1: 1.30, det: 2, buds: .09, suns: .18,
          fills: ["url(#gBlush)", "url(#gDeep)", "url(#gCream)", "url(#gBlush)", "url(#gPeach)"], stem: "url(#gStem)",
          base: 4.75, span: 1.6, leaves: 3, op: 1, sway: [5.5, 8]
        }
      ];

      function bez(p0, p1, p2, p3, t) {
        var u = 1 - t;
        return {
          x: u * u * u * p0.x + 3 * u * u * t * p1.x + 3 * u * t * t * p2.x + t * t * t * p3.x,
          y: u * u * u * p0.y + 3 * u * u * t * p1.y + 3 * u * t * t * p2.y + t * t * t * p3.y
        };
      }
      function bezTan(p0, p1, p2, p3, t) {
        var u = 1 - t;
        return {
          x: 3 * u * u * (p1.x - p0.x) + 6 * u * t * (p2.x - p1.x) + 3 * t * t * (p3.x - p2.x),
          y: 3 * u * u * (p1.y - p0.y) + 6 * u * t * (p2.y - p1.y) + 3 * t * t * (p3.y - p2.y)
        };
      }

      var roses = 0, suns = 0, lastBloom = 0;

      LAYERS.forEach(function (L) {
        var host = document.getElementById(L.id);
        host.setAttribute("opacity", L.op);

        var plants = [], i;
        for (i = 0; i < L.n; i++) {
          var t = (i + .5) / L.n;
          var isSun = rnd() < L.suns;
          var y = L.y0 + rnd() * (L.y1 - L.y0);
          plants.push({
            x: -30 + t * (VB_W + 60) + jit(VB_W / L.n * .45),
            /* i girasoli svettano sopra le rose, come nella realta' */
            y: isSun ? L.y0 + (y - L.y0) * .55 : y,
            s: (L.s0 + rnd() * (L.s1 - L.s0)) * (isSun ? .9 : 1),
            r: isSun ? jit(7) : jit(12),
            isSun: isSun,
            isBud: !isSun && rnd() < L.buds
          });
        }
        /* le piu alte sono le piu lontane: vanno disegnate per prime */
        plants.sort(function (a, b) { return a.y - b.y; });

        plants.forEach(function (f, i) {
          var len = GROUND - f.y;
          var bx = f.x + jit(Math.min(150, len * .28));
          var p0 = { x: bx, y: GROUND },
            p3 = { x: f.x, y: f.y },
            p1 = { x: bx + (f.x - bx) * .12, y: GROUND - len * .48 },
            p2 = { x: f.x - (f.x - bx) * .28, y: f.y + len * .36 };

          var sDelay = L.base + (i / L.n) * L.span + rnd() * .3;
          var bDelay = sDelay + .95 + rnd() * .2;
          if (bDelay > lastBloom) lastBloom = bDelay;

          var stalk = el("g", { "class": "stalk" });
          stalk.style.setProperty("--s", sDelay.toFixed(2) + "s");
          stalk.style.setProperty("--b", bDelay.toFixed(2) + "s");

          var sway = el("g", { "class": "sway" });
          sway.style.setProperty("--ox", bx.toFixed(1) + "px");
          sway.style.setProperty("--sd", (L.sway[0] + rnd() * (L.sway[1] - L.sway[0])).toFixed(2) + "s");
          sway.style.setProperty("--sdl", (7 + rnd() * 3).toFixed(2) + "s");

          sway.appendChild(el("path", {
            d: "M" + p0.x.toFixed(1) + "," + p0.y +
              " C" + p1.x.toFixed(1) + "," + p1.y.toFixed(1) +
              " " + p2.x.toFixed(1) + "," + p2.y.toFixed(1) +
              " " + p3.x.toFixed(1) + "," + p3.y.toFixed(1),
            "class": "stem", pathLength: 100, stroke: L.stem,
            /* il girasole regge una testa molto piu' pesante: fusto piu' grosso */
            "stroke-width": ((1.4 + 3.4 * f.s) * (f.isSun ? 1.55 : 1)).toFixed(2)
          }));

          /* spine: solo sulle rose in primo piano, dove si vedono davvero */
          if (L.det > 1 && !f.isSun) {
            [.46, .68].forEach(function (tt) {
              var pt = bez(p0, p1, p2, p3, tt), tn = bezTan(p0, p1, p2, p3, tt);
              var ang = Math.atan2(tn.y, tn.x) * 180 / Math.PI;
              var th = el("g", {
                transform: "translate(" + pt.x.toFixed(1) + "," + pt.y.toFixed(1) + ") " +
                  "rotate(" + (ang + (rnd() < .5 ? -74 : 74)).toFixed(1) + ") " +
                  "scale(" + f.s.toFixed(2) + ")"
              });
              th.appendChild(el("path", {
                d: "M0,-1.7 L7.6,0 L0,1.7 Z",
                fill: WIRE ? "none" : "#3A5F45",
                stroke: WIRE ? "currentColor" : "none",
                "stroke-width": .9,
                "class": "thorn"
              }));
              sway.appendChild(th);
            });
          }

          var spots = [[.34], [.32, .62], [.24, .48, .7]][L.leaves - 1];
          spots.forEach(function (t, k) {
            var pt = bez(p0, p1, p2, p3, t), tan = bezTan(p0, p1, p2, p3, t);
            var ang = Math.atan2(tan.y, tan.x) * 180 / Math.PI;
            var side = (k % 2 === 0) ? -1 : 1;
            var wrap = el("g", {
              transform: "translate(" + pt.x.toFixed(1) + "," + pt.y.toFixed(1) + ") " +
                "rotate(" + (ang + side * (48 + jit(12))).toFixed(1) + ") " +
                "scale(" + (f.s * (1 - k * .15) * (f.isSun ? 1.3 : 1)).toFixed(2) + ")"
            });
            /* la foglia del girasole e' larga e a cuore, quella della rosa e' ovale */
            var leaf = el("path", {
              d: f.isSun ? "M0,0 C9,-17 30,-21 47,-8 C41,11 14,17 0,0 Z"
                : "M0,0 C11,-9 30,-8 44,0 C30,9 11,10 0,0 Z",
              "class": "leaf"
            });
            leaf.style.setProperty("--k", k);
            wrap.appendChild(leaf);
            sway.appendChild(wrap);
          });

          var head = el("g", {
            transform: "translate(" + f.x.toFixed(1) + "," + f.y.toFixed(1) + ") " +
              "rotate(" + f.r.toFixed(1) + ") scale(" + f.s.toFixed(2) + ")"
          });

          /* il girasole ha un dondolio suo, piu' lento del gambo e fuori fase */
          var pivot = head;
          if (f.isSun) {
            pivot = el("g", { "class": "helio" });
            pivot.style.setProperty("--hd", (11 + rnd() * 7).toFixed(2) + "s");
            pivot.style.setProperty("--hdl", (6 + rnd() * 4).toFixed(2) + "s");
            head.appendChild(pivot);
          }

          var bloom = el("g", { "class": L.det > 0 ? "bloom breathe" : "bloom" });
          bloom.style.setProperty("--bd", (6.5 + rnd() * 4).toFixed(2) + "s");
          bloom.style.setProperty("--bdl", (bDelay + 1.4 + rnd() * 2).toFixed(2) + "s");

          if (f.isSun) { sunflower(bloom, L.det); suns++; }
          else if (f.isBud) bud(bloom, pick(L.fills));
          else { rose(bloom, pick(L.fills), L.det); roses++; }

          pivot.appendChild(bloom);
          sway.appendChild(head);

          stalk.appendChild(sway);
          host.appendChild(stalk);
        });
      });

      /* ---------- sottobosco: chiude il bordo basso ---------- */
      var turf = document.getElementById("turf");
      var nTuft = Math.round(26 * K);
      for (var t2 = 0; t2 < nTuft; t2++) {
        var tx = -30 + ((t2 + .5) / nTuft) * (VB_W + 60) + jit(VB_W / nTuft * .5);
        var tuft = el("g", { transform: "translate(" + tx.toFixed(1) + "," + GROUND + ")" });
        tuft.style.setProperty("--s", (2.4 + rnd() * 2.4).toFixed(2) + "s");
        var nb = 3 + ((rnd() * 3) | 0);
        for (var b = 0; b < nb; b++) {
          var sc = .55 + rnd() * .75;
          var g2 = el("g", {
            transform: "rotate(" + jit(46).toFixed(1) + ") scale(" + sc.toFixed(2) + "," + (.8 + rnd() * .7).toFixed(2) + ")"
          });
          g2.appendChild(el("path", {
            d: "M0,0 C-7,-46 -5,-92 0,-124 C6,-92 9,-46 0,0 Z",
            "class": "blade"
          }));
          tuft.appendChild(g2);
        }
        turf.appendChild(tuft);
      }

      /* ---------- polline ---------- */
      var sparks = document.getElementById("sparks");
      for (var s2 = 0; s2 < 30; s2++) {
        var c = el("circle", {
          cx: (rnd() * VB_W).toFixed(1),
          cy: (50 + rnd() * 640).toFixed(1),
          r: (.9 + rnd() * 1.9).toFixed(2),
          "class": "spark"
        });
        c.style.animationDelay = (6.5 + rnd() * 9).toFixed(2) + "s";
        c.style.animationDuration = (7 + rnd() * 5).toFixed(2) + "s";
        sparks.appendChild(c);
      }

      /* ---------- terminale ---------- */
      var CMDS = {
        garden: "> node plant.js --roses ",
        code: "$ ./grow --seed love --n ",
        blueprint: "> cad: rose.dxf  n=",
        paper: "> print bouquet.pdf  n="
      };
      var cmd = (CMDS[STYLE] || CMDS.garden) + roses;
      var l1 = document.getElementById("l1");
      l1.textContent = cmd;
      l1.style.animation = "type 1.05s steps(" + cmd.length + ",end) .28s forwards, caret .58s step-end 8";
      var st = document.createElement("style");
      st.textContent = "@keyframes type{to{width:" + cmd.length + "ch}}";
      document.head.appendChild(st);
      document.getElementById("l2").textContent =
        "growing " + roses + " roses + " + suns + " sunflowers…";

      /* ---------- la dedica ---------- */
      function param(name, fallback, max) {
        var v = new URLSearchParams(location.search).get(name);
        if (v === null || v === "") return fallback;
        v = v.replace(/[ \t]+/g, " ").trim();
        if (v.length > max) v = v.slice(0, max).trim() + "…";
        return v;
      }
      /* {n} = rose piantate, {s} = girasoli */
      function fill(t) { return t.split("{n}").join(roses).split("{s}").join(suns); }

      var toTxt = fill(param("to", "My Love", 40));
      var eyeTxt = fill(param("occasion", "Forever & Always", 40));
      var fromTxt = fill(param("from", "", 40));
      var dedTxt = fill(param("msg",
        "I planted {n} roses and {s} sunflowers for you.|Not one of them will ever wilt.|Neither will how I feel about you.", 220));

      var eye = document.getElementById("eyebrow");
      eye.textContent = eyeTxt;
      eye.style.setProperty("--d", "var(--t-msg)");

      var toEl = document.getElementById("to");
      toEl.textContent = toTxt;
      toEl.style.setProperty("--d", "calc(var(--t-msg) + .35s)");

      var ded = document.getElementById("ded");
      var lines = dedTxt.split("|").slice(0, 5);
      lines.forEach(function (line, i) {
        var sp = document.createElement("span");
        sp.className = "ln rise";
        sp.textContent = line.trim();
        sp.style.setProperty("--d", "calc(var(--t-msg) + " + (.95 + i * .55).toFixed(2) + "s)");
        ded.appendChild(sp);
      });

      var fromEl = document.getElementById("from");
      fromEl.textContent = fromTxt ? "— " + fromTxt : "";
      fromEl.style.setProperty("--d", "calc(var(--t-msg) + " + (1.2 + lines.length * .55).toFixed(2) + "s)");

      document.title = toTxt + " · a rose garden";

      /* ---------- petali che cadono ---------- */
      var fall = document.getElementById("fall");
      var COLORS = {
        garden: ["#F2B8C6", "#C4576B", "#FDF6F0", "#F5C99B", "#7A2F42", "#F2B01F", "#FFE486"],
        code: ["#3DDE84", "#5CF0A2", "#1B7A47", "#C9FADC"],
        blueprint: ["#7FD4FF", "#FF8FB0", "#DCEEFF", "#54A8D6"],
        paper: ["#E29CB0", "#C4576B", "#E8C9A0", "#A8895F", "#E0A62A"]
      };
      var PAL = COLORS[STYLE] || COLORS.garden;

      function makePetal(x, y, sc) {
        var d = document.createElement("div");
        d.className = "fp";
        d.style.left = x + "px";
        d.style.top = y + "px";
        d.style.background = pick(PAL);
        d.style.width = (11 * sc).toFixed(1) + "px";
        d.style.height = (14 * sc).toFixed(1) + "px";
        fall.appendChild(d);
        return d;
      }

      function drift() {
        if (REDUCED || document.hidden) return;
        var w = stage.clientWidth, h = stage.clientHeight;
        var d = makePetal(w * (.03 + rnd() * .94), -26, .6 + rnd() * .75);
        var a = d.animate([
          { transform: "translate3d(0,0,0) rotate(0deg)", opacity: 0 },
          { opacity: .9, offset: .1 },
          { opacity: .9, offset: .74 },
          {
            transform: "translate3d(" + jit(120).toFixed(0) + "px," + (h + 70) + "px,0) rotate(" +
              (300 + rnd() * 460).toFixed(0) + "deg)", opacity: 0
          }
        ], { duration: 5600 + rnd() * 3400, easing: "cubic-bezier(.35,.05,.55,1)" });
        a.onfinish = function () { d.remove(); };
      }

      function puff(x, y) {
        if (REDUCED) return;
        for (var i = 0; i < 16; i++) {
          var d = makePetal(x, y, .5 + rnd() * .6);
          var ang = (i / 16) * Math.PI * 2 + jit(.3);
          var dist = 70 + rnd() * 160;
          var a = d.animate([
            { transform: "translate3d(0,0,0) rotate(0deg) scale(.4)", opacity: .95 },
            {
              transform: "translate3d(" + (Math.cos(ang) * dist).toFixed(1) + "px," +
                (Math.sin(ang) * dist * .8 + 100).toFixed(1) + "px,0) rotate(" +
                (rnd() * 560 - 280).toFixed(0) + "deg) scale(1)", opacity: 0
            }
          ], { duration: 1000 + rnd() * 600, easing: "cubic-bezier(.2,.7,.3,1)" });
          a.onfinish = (function (node) { return function () { node.remove(); }; })(d);
        }
      }

      if (!REDUCED) setTimeout(function () { drift(); setInterval(drift, 1000); }, 7000);

      /* ---------- tap ---------- */
      var blooms = document.querySelectorAll(".bloom");
      stage.addEventListener("pointerdown", function (e) {
        puff(e.clientX, e.clientY);
        for (var i = 0; i < blooms.length; i++) {
          (function (b, k) {
            b.classList.remove("pop");
            setTimeout(function () { b.classList.add("pop"); }, k * 8);
          })(blooms[i], i);
        }
        askTilt();
      });
      Array.prototype.forEach.call(blooms, function (b) {
        b.addEventListener("animationend", function (ev) {
          if (ev.animationName === "pop") b.classList.remove("pop");
        });
      });

      /* ---------- tilt: parallasse fra i piani ---------- */
      var back = document.getElementById("back"),
        mid = document.getElementById("mid"),
        front = document.getElementById("front"),
        halo = document.getElementById("halo");
      var cur = 0, target = 0, raf = null, tilted = false;

      function onTilt(e) {
        var g = e.gamma;
        if (g === null || g === undefined) return;
        target = Math.max(-18, Math.min(18, g)) / 18;
        if (!raf) raf = requestAnimationFrame(loop);
      }
      function loop() {
        cur += (target - cur) * .08;
        back.style.transform = "translateX(" + (cur * -16).toFixed(1) + "px)";
        mid.style.transform = "translateX(" + (cur * -6).toFixed(1) + "px)";
        front.style.transform = "translateX(" + (cur * 13).toFixed(1) + "px)";
        halo.style.transform = "translate(-50%,-50%) translateX(" + (cur * -22).toFixed(1) + "px)";
        if (Math.abs(target - cur) > .0008) raf = requestAnimationFrame(loop);
        else raf = null;
      }
      function askTilt() {
        if (tilted || REDUCED) return;
        tilted = true;
        var DOE = window.DeviceOrientationEvent;
        if (!DOE) return;
        if (typeof DOE.requestPermission === "function") {
          DOE.requestPermission().then(function (r) {
            if (r === "granted") window.addEventListener("deviceorientation", onTilt);
          }).catch(function () { });
        } else {
          window.addEventListener("deviceorientation", onTilt);
        }
      }
      if (window.DeviceOrientationEvent && typeof window.DeviceOrientationEvent.requestPermission !== "function") {
        tilted = true;
        window.addEventListener("deviceorientation", onTilt);
      }

      /* ---------- panel: customize romantic couple love note ---------- */
      var PRESETS = {
        eterno: {
          to: "My Love",
          occasion: "Forever & Always",
          from: "",
          msg: "I planted {n} roses and {s} sunflowers for you.\nNot one of them will ever wilt.\nNeither will how I feel about you."
        },
        penso: {
          to: "My Special Someone",
          occasion: "Just thinking of you",
          from: "",
          msg: "A little garden blooming just for you,\nto remind you how deeply loved you are.\nYou bring sunshine into every single day."
        },
        distanza: {
          to: "To My Other Half",
          occasion: "Miles apart, close at heart",
          from: "",
          msg: "Distance means so little when you mean so much.\nThis garden grows for us every day,\ncounting down until I hold you again."
        },
        anniversario: {
          to: "To My Forever",
          occasion: "Happy Anniversary",
          from: "",
          msg: "Every moment with you is a gift I cherish.\nThank you for being my love, my best friend,\nand my favorite part of every day."
        },
        giorno: {
          to: "Good Morning Beautiful",
          occasion: "A morning smile",
          from: "",
          msg: "I wanted to start your day\nwith flowers that will never stop blooming,\njust like your beautiful smile."
        },
        promessa: {
          to: "My Whole Heart",
          occasion: "My Promise to You",
          from: "",
          msg: "{n} roses to promise I will always stand by you,\n{s} sunflowers to brighten up your world.\nYou will always be my forever choice."
        }
      };

      var qs = new URLSearchParams(location.search);
      var F = {
        to: document.getElementById("f-to"),
        occasion: document.getElementById("f-occ"),
        from: document.getElementById("f-from"),
        msg: document.getElementById("f-msg"),
        style: document.getElementById("f-style")
      };

      /* Initialize form fields */
      F.to.value = qs.get("to") !== null ? qs.get("to") : "My Love";
      F.occasion.value = qs.get("occasion") !== null ? qs.get("occasion") : "Forever & Always";
      F.from.value = qs.get("from") || "";
      F.msg.value = qs.get("msg") !== null 
        ? qs.get("msg").split("|").join("\n") 
        : PRESETS.eterno.msg;
      F.style.value = STYLE;

      /* Toast Notification */
      var toastEl = document.getElementById("toast");
      var toastTimer = null;
      function showToast(text) {
        if (!toastEl) return;
        toastEl.textContent = text;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
          toastEl.classList.remove("show");
        }, 2500);
      }

      /* Line counter for love note */
      var linesBadge = document.getElementById("f-msg-lines");
      function updateLinesCount() {
        if (!linesBadge) return;
        var lines = F.msg.value.split("\n").filter(function (s) { return s.trim().length > 0; });
        var count = lines.length || (F.msg.value.length ? 1 : 0);
        linesBadge.textContent = count + "/5 lines";
        linesBadge.style.color = count > 5 ? "#FF6B6B" : "";
      }
      F.msg.addEventListener("input", updateLinesCount);
      updateLinesCount();

      /* Template selection chips */
      var chips = document.querySelectorAll(".preset-chips .chip");
      chips.forEach(function (chip) {
        chip.addEventListener("click", function () {
          var key = this.getAttribute("data-preset");
          var preset = PRESETS[key];
          if (!preset) return;
          chips.forEach(function (c) { c.classList.remove("active"); });
          this.classList.add("active");
          F.to.value = preset.to;
          F.occasion.value = preset.occasion;
          F.from.value = preset.from;
          F.msg.value = preset.msg;
          updateLinesCount();
          showToast("✨ Template applied!");
        });
      });

      /* Shareable URL calculation */
      function getBaseURL() {
        if (location.origin && location.origin !== "null") {
          return location.origin + location.pathname;
        }
        return location.href.split("?")[0].split("#")[0];
      }

      function buildURL() {
        var p = new URLSearchParams();
        if (F.style.value && F.style.value !== "garden") p.set("style", F.style.value);
        if (F.to.value.trim()) p.set("to", F.to.value.trim());
        if (F.occasion.value.trim()) p.set("occasion", F.occasion.value.trim());
        if (F.from.value.trim()) p.set("from", F.from.value.trim());
        
        var m = F.msg.value.split("\n")
          .map(function (s) { return s.trim(); })
          .filter(function (s) { return s.length > 0; })
          .slice(0, 5)
          .join("|");
        if (m) p.set("msg", m);

        var s = p.toString();
        return getBaseURL() + (s ? "?" + s : "");
      }

      /* Copy with universal fallback */
      function fallbackCopyText(text, onSuccess) {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "-9999px";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          var ok = document.execCommand("copy");
          if (ok && onSuccess) onSuccess();
          else showToast("Copy failed");
        } catch (e) {
          showToast("Copy failed");
        }
        document.body.removeChild(ta);
      }

      function executeCopyLink() {
        var u = buildURL();
        function done() {
          showToast("✨ Link copied! Send it to your love 💌");
          var b = document.getElementById("p-copy");
          if (b) {
            var old = b.textContent;
            b.textContent = "✓ Copied!";
            setTimeout(function () { b.textContent = old; }, 2000);
          }
        }
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(u).then(done, function () {
            fallbackCopyText(u, done);
          });
        } else {
          fallbackCopyText(u, done);
        }
      }

      /* Panel open and close */
      var panel = document.getElementById("panel");
      function openPanel(on) { panel.classList.toggle("on", on); }

      document.getElementById("edit").addEventListener("click", function (e) {
        e.stopPropagation();
        openPanel(!panel.classList.contains("on"));
      });
      panel.addEventListener("pointerdown", function (e) { e.stopPropagation(); });

      var pClose = document.getElementById("p-close");
      if (pClose) pClose.addEventListener("click", function () { openPanel(false); });
      var pCloseBtn = document.getElementById("p-close-btn");
      if (pCloseBtn) pCloseBtn.addEventListener("click", function () { openPanel(false); });

      /* Preview Action */
      document.getElementById("p-go").addEventListener("click", function () {
        location.href = buildURL();
      });

      /* Copy Link Action */
      var pCopy = document.getElementById("p-copy");
      if (pCopy) pCopy.addEventListener("click", executeCopyLink);

      /* WhatsApp Action */
      var pWa = document.getElementById("p-wa");
      if (pWa) {
        pWa.addEventListener("click", function () {
          var u = buildURL();
          var recipient = F.to.value.trim() || "My Love";
          var shareText = "🌹 I planted a special garden of flowers for you, " + recipient + " ✨\nThey will never wilt.\n\nOpen your garden here:\n" + u;
          var waUrl = "https://api.whatsapp.com/send?text=" + encodeURIComponent(shareText);
          window.open(waUrl, "_blank");
          showToast("Opening WhatsApp... 💬");
        });
      }

      /* Native Share Action */
      var pShare = document.getElementById("p-share");
      if (pShare) {
        pShare.addEventListener("click", function () {
          var u = buildURL();
          var recipient = F.to.value.trim() || "My Love";
          if (navigator.share) {
            navigator.share({
              title: recipient + " · A Garden For You",
              text: "I planted an eternal garden of flowers that will never wilt for you 🌹✨",
              url: u
            }).then(function () {
              showToast("Shared successfully! 💌");
            }).catch(function (err) {
              if (err && err.name !== "AbortError") {
                executeCopyLink();
              }
            });
          } else {
            executeCopyLink();
          }
        });
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") openPanel(false);
      });
    })();
  </script>
</body>

</html>
