<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e2a" />
  <title>Under the Same Sky ✷</title>
  <!-- tab logo: a little golden crescent moon + star on a night sky -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e2a'/%3E%3Cpath d='M41 15a18 18 0 1 0 8 24 14 14 0 0 1-8-24z' fill='%23ffd884'/%3E%3Cpath d='M20 20l1.6 4.4L26 26l-4.4 1.6L20 32l-1.6-4.4L14 26l4.4-1.6z' fill='%23ffe9b0'/%3E%3Ccircle cx='46' cy='48' r='1.6' fill='%23ffffff'/%3E%3Ccircle cx='14' cy='44' r='1.3' fill='%23bfe0ff'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0e2a'/%3E%3Cpath d='M41 15a18 18 0 1 0 8 24 14 14 0 0 1-8-24z' fill='%23ffd884'/%3E%3Cpath d='M20 20l1.6 4.4L26 26l-4.4 1.6L20 32l-1.6-4.4L14 26l4.4-1.6z' fill='%23ffe9b0'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=192" />
</head>
<body>
  <!-- Canvas for the living starfield, shooting stars, and stardust -->
  <canvas id="fx-canvas"></canvas>

  <!-- The moon -->
  <div id="moon" class="moon" aria-hidden="true"></div>

  <!-- Floating music toggle -->
  <button id="music-toggle" class="music-toggle" aria-label="Toggle music" title="Toggle music">
    <span class="music-icon">♪</span>
  </button>

  <!-- little spinning vinyl (spins while music plays) + now-playing label -->
  <div id="vinyl" class="vinyl" aria-hidden="true"></div>
  <div id="now-playing" class="now-playing" aria-hidden="true">
    <span class="np-text"></span>
    <button id="song-next" class="song-next" aria-label="Next song" title="Next song">⏭</button>
  </div>

  <!-- Progress (constellations lit) -->
  <div id="progress" class="progress" aria-hidden="true"></div>

  <!-- The experience mounts here -->
  <main id="stage" class="stage" role="main"></main>

  <!-- Sky lanterns float above the stage for popping -->
  <div id="lantern-layer" class="lantern-layer" aria-hidden="true"></div>

  <audio id="bg-song" loop preload="auto"></audio>

  <script src="js/config.js?v=192"></script>
  <script src="js/sky.js?v=192"></script>
  <script src="js/app.js?v=192"></script>
</body>
</html>
